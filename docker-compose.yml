services:
  postgres:
    image: postgres:16-alpine
    container_name: sahara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sahara
      POSTGRES_PASSWORD: sahara_dev_password
      POSTGRES_DB: sahara
    ports:
      - "5432:5432"
    volumes:
      - sahara_pgdata:/var/lib/postgresql/data

volumes:
  sahara_pgdata:
